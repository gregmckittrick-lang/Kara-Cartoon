<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kara's Summer 2027 Crossroads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cardinal:#990000; --gold:#FFCC00; --ink:#2a1a14; --paper:#fffaf0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#2b1712;color:var(--ink);
    font-family:'Baloo 2', ui-rounded, 'Segoe UI', system-ui, sans-serif;}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px 12px 28px}
  header{width:100%;max-width:920px;display:flex;justify-content:space-between;align-items:baseline;color:#fff;margin-bottom:10px;gap:10px;flex-wrap:wrap}
  header h1{margin:0;font-size:clamp(20px,3.4vw,30px);font-weight:800;letter-spacing:.3px}
  header h1 span{color:var(--gold)}
  #sceneLabel{font-weight:700;color:#f3d9a8;font-size:15px;background:rgba(255,255,255,.08);padding:3px 12px;border-radius:999px}

  .frame{width:100%;max-width:920px;background:var(--paper);border-radius:22px;padding:10px;box-shadow:0 18px 50px rgba(0,0,0,.45), inset 0 0 0 4px var(--gold)}
  .stage{position:relative;width:100%;container-type:inline-size;border-radius:16px;overflow:hidden;background:#cfe9ff}
  .stage svg{display:block;width:100%;height:auto}

  /* ---------- speech bubbles ---------- */
  .bubble{position:absolute;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:.7em .95em;
    font-size:clamp(12px,2.15cqw,19px);line-height:1.3;font-weight:600;box-shadow:4px 5px 0 rgba(0,0,0,.18);
    opacity:0;transform:scale(.6);transform-origin:var(--origin, 20% 100%);transition:opacity .25s, transform .35s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
  .bubble.show{opacity:1;transform:scale(1);pointer-events:auto}
  .bubble .who{display:block;font-weight:800;font-size:.78em;letter-spacing:.6px;text-transform:uppercase;margin-bottom:.15em}
  #karaBubble{left:3%;top:3%;width:41%;--origin:45% 100%}
  #karaBubble .who{color:var(--cardinal)}
  #karaBubble::after{content:"";position:absolute;left:46%;bottom:-20px;border:11px solid transparent;border-top:14px solid var(--ink)}
  #karaBubble::before{content:"";position:absolute;left:calc(46% + 3px);bottom:-13px;border:8px solid transparent;border-top:11px solid #fff;z-index:1}
  #karaBubble.thought{border-radius:40px;border-style:dashed}
  #karaBubble.thought::before,#karaBubble.thought::after{border:3px solid var(--ink);background:#fff;border-radius:50%}
  #karaBubble.thought::after{width:20px;height:20px;left:40%;bottom:-30px}
  #karaBubble.thought::before{width:11px;height:11px;left:47%;bottom:-48px}
  #catBubble{right:3%;top:3%;width:47%;--origin:30% 100%}
  #catBubble .who{color:#c96a08}
  #catBubble::after{content:"";position:absolute;left:22%;bottom:-20px;border:11px solid transparent;border-top:14px solid var(--ink)}
  #catBubble::before{content:"";position:absolute;left:calc(22% + 3px);bottom:-13px;border:8px solid transparent;border-top:11px solid #fff;z-index:1}
  .caret{display:inline-block;width:.45em;animation:blink .8s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .choices{display:none;gap:.6em;margin-top:.6em}
  .choices.show{display:flex;animation:rise .3s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}}
  .choices button{flex:1;font:inherit;font-weight:800;font-size:1em;border:3px solid var(--ink);border-radius:14px;padding:.35em .6em;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .1s, box-shadow .1s}
  .choices button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .yes{background:#7ed957}
  .no{background:#ff8a80}
  .choices button:hover{filter:brightness(1.07)}

  @container (max-width: 600px){
    .bubble{position:relative;left:auto!important;right:auto!important;top:auto!important;width:auto!important;margin:8px;display:none;font-size:15px}
    .bubble.show{display:block}
    .bubble::before,.bubble::after{display:none}
  }

  /* ---------- controls ---------- */
  .controls{display:flex;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap;min-height:48px}
  .ctrl{font:inherit;font-weight:800;font-size:17px;border:3px solid var(--ink);border-radius:999px;padding:6px 22px;cursor:pointer;
    background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .1s, box-shadow .1s}
  .ctrl.alt{background:#fff}
  .ctrl:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .ctrl[hidden]{display:none}
  .hint{color:#c9b39a;font-size:13px;margin-top:10px;text-align:center}

  /* ---------- character animation ---------- */
  #kara{transform-box:fill-box;transform-origin:50% 100%;animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-3px)}}
  .k-arm-think,.k-arm-cheer{display:none}
  #kara.thinking .k-arm-down-r{display:none}
  #kara.thinking .k-arm-think{display:inline}
  #kara.cheer .k-arm-down-r,#kara.cheer .k-arm-down-l{display:none}
  #kara.cheer .k-arm-cheer{display:inline}
  #kara.cheer{animation:hop .55s ease-in-out 3}
  @keyframes hop{50%{transform:translateY(-14px)}}

  #catWrap{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);opacity:0}
  #catWrap.in{animation:popIn .6s cubic-bezier(.3,1.7,.5,1) forwards}
  #catWrap.out{animation:popOut .35s ease-in forwards}
  @keyframes popIn{0%{transform:scale(0) translateY(20px);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes popOut{0%{transform:scale(1);opacity:1}100%{transform:scale(0) translateY(20px);opacity:0}}
  #cat{transform-box:fill-box;transform-origin:50% 100%}
  #cat.celebrate{animation:catJump .5s ease-in-out infinite}
  @keyframes catJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px) rotate(-4deg)}}
  #catHead{transform-box:fill-box;transform-origin:50% 90%;transition:transform .5s}
  #cat.thinking #catHead{transform:rotate(-14deg)}
  #cat.frown #catHead{transform:rotate(6deg) translateY(3px)}
  #catTail{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1.4s ease-in-out infinite}
  #cat.celebrate #catTail{animation-duration:.35s}
  #cat.frown #catTail{animation:none;transform:rotate(30deg)}
  @keyframes wag{50%{transform:rotate(-14deg)}}
  .c-arms-up,.c-arm-think{display:none}
  #cat.celebrate .c-arms-down{display:none}
  #cat.celebrate .c-arms-up{display:inline}
  #cat.thinking .c-arm-r{display:none}
  #cat.thinking .c-arm-think{display:inline}
  .c-face{display:none}
  #cat.f-normal .c-normal,#cat.f-happy .c-happy,#cat.f-smile .c-smile,#cat.f-frown .c-frown,#cat.f-think .c-think{display:inline}
  #catDots{opacity:0}
  #cat.thinking #catDots{opacity:1}
  #catDots circle{animation:dot 1.2s infinite}
  #catDots circle:nth-child(2){animation-delay:.2s}
  #catDots circle:nth-child(3){animation-delay:.4s}
  @keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}

  .k-face{display:none}
  #kara.f-worried .k-worried,#kara.f-neutral .k-neutral,#kara.f-happy .k-happy,#kara.f-think .k-think,#kara.f-determined .k-determined{display:inline}

  .cloud{animation:drift 40s linear infinite}
  .cloud.c2{animation-duration:60s;animation-delay:-20s}
  @keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(900px)}}
  .flag{transform-box:fill-box;transform-origin:0% 50%;animation:flap 2.4s ease-in-out infinite}
  @keyframes flap{50%{transform:skewY(6deg) scaleX(.92)}}
  .confetti{animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(560px) rotate(720deg)}}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01s!important;animation-iteration-count:1!important}
  }
</style>
</head>

              <ellipse cx="-12" cy="-104" rx="5" ry="7" fill="#2a1a14"/><ellipse cx="12" cy="-104" rx="5" ry="7" fill="#2a1a14"/>
              <circle cx="-10" cy="-107" r="1.8" fill="#fff"/><circle cx="14" cy="-107" r="1.8" fill="#fff"/>
              <path d="M-6,-86 q3,4 6,0 q3,4 6,0" fill="none" stroke="#2a1a14" stroke-width="2" stroke-linecap="round"/>
            </g>
            <g class="c-face c-happy" fill="none" stroke="#2a1a14" stroke-width="3" stroke-linecap="round">
              <path d="M-17,-102 q5,-8 10,0"/><path d="M7,-102 q5,-8 10,0"/>
              <path d="M-8,-87 q8,12 16,0z" fill="#c0392b" stroke-width="2"/>
            </g>
            <g class="c-face c-smile">
              <ellipse cx="-12" cy="-104" rx="5" ry="6" fill="#2a1a14"/><ellipse cx="12" cy="-104" rx="5" ry="6" fill="#2a1a14"/>
              <circle cx="-10" cy="-106" r="1.8" fill="#fff"/><circle cx="14" cy="-106" r="1.8" fill="#fff"/>
              <path d="M-8,-87 q8,8 16,0" fill="none" stroke="#2a1a14" stroke-width="2.4" stroke-linecap="round"/>
            </g>
            <g class="c-face c-frown" stroke="#2a1a14" stroke-linecap="round" fill="none" stroke-width="2.4">
              <ellipse cx="-12" cy="-103" rx="4.5" ry="5" fill="#2a1a14" stroke="none"/><ellipse cx="12" cy="-103" rx="4.5" ry="5" fill="#2a1a14" stroke="none"/>
              <path d="M-19,-110 L-7,-115"/><path d="M19,-110 L7,-115"/>
              <path d="M-7,-82 q7,-7 14,0"/>
            </g>
            <g class="c-face c-think" stroke="#2a1a14" stroke-linecap="round" fill="none" stroke-width="2.4">
              <ellipse cx="-10" cy="-106" rx="4.5" ry="6" fill="#2a1a14" stroke="none"/><ellipse cx="14" cy="-106" rx="4.5" ry="6" fill="#2a1a14" stroke="none"/>
              <path d="M-17,-116 L-5,-115"/><path d="M8,-118 q6,-4 12,0"/>
              <path d="M-5,-85 h10"/>
            </g>
          </g>
          <g id="catDots" fill="#2a1a14"><circle cx="40" cy="-140" r="4"/><circle cx="52" cy="-150" r="5"/><circle cx="66" cy="-162" r="6"/></g>
        </g>
       </g>
      </g>

      <g id="confettiLayer"></g>
    </svg>

    <div class="bubble" id="karaBubble" aria-live="polite"><span class="who">Kara</span><span class="txt"></span></div>
    <div class="bubble" id="catBubble" aria-live="polite"><span class="who">Career Cat</span><span class="txt"></span>
      <div class="choices" id="choices">
        <button class="yes" id="yesBtn">Yes</button>
        <button class="no" id="noBtn">No</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl" id="nextBtn">Next ▶</button>
    <button class="ctrl alt" id="otherBtn" hidden>↩ Try the other answer</button>
    <button class="ctrl alt" id="restartBtn" hidden>⟲ Play again</button>
  </div>
</div>
<div class="hint">Tip: click a speech bubble to skip the typing.</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const kara = $('kara'), cat = $('cat'), catWrap = $('catWrap');
  const kB = $('karaBubble'), cB = $('catBubble'), choices = $('choices');
  const nextBtn = $('nextBtn'), otherBtn = $('otherBtn'), restartBtn = $('restartBtn');
  const sceneLabel = $('sceneLabel');
  let typer = null, timers = [], onNext = null, lastQuestion = null;

  const T = {
    s1:  "I've been trying so hard, but no Summer 2027 internships yet. What more can I do?",
    s2q: "Will you consider applying for international Summer 2027 internship programs?",
    s2y: "Yay! 🎉 Great choice! Going international, you'll successfully land a job offer and stay right on track to graduate on time with your class!",
    s2n: "Hmm… what about an off-cycle internship for Fall 2027? You'd only delay graduation by one semester, but you'd have a real job after graduation.",
    s3:  "Is there any other choice that keeps me graduating with my class at USC? Hmmm…",
    s4q: "Will you consider going directly into graduate school after USC?",
    s4y: "OK, that's possible! But you'll need excellent grades and professor recommendations to get into an Ivy-level graduate program.",
    s4n: "Hmm… what will you do then?"
  };

  function later(fn, ms){ const t = setTimeout(fn, ms); timers.push(t); }
  function clearTimers(){ timers.forEach(clearTimeout); timers = []; document.getElementById('confettiLayer').innerHTML = ''; if (typer) { typer.stop(); typer = null; } }

  function setFace(el, face){ el.className.baseVal = el.className.baseVal.replace(/\bf-\w+/g,'').trim() + ' f-' + face; }
  function setPose(el, poses){ // keep face class, replace pose classes
    const face = (el.className.baseVal.match(/\bf-\w+/)||[''])[0];
    el.className.baseVal = [face, ...poses].join(' ').trim();
  }

  function showCat(){ catWrap.classList.remove('out'); void catWrap.getBBox(); catWrap.classList.add('in'); }
  function hideCat(){ if (catWrap.classList.contains('in')) { catWrap.classList.remove('in'); catWrap.classList.add('out'); } }

  function say(bubble, text, done){
    const span = bubble.querySelector('.txt');
    bubble.classList.add('show');
    span.textContent = '';
    let i = 0, stopped = false;
    const chars = Array.from(text);
    const caret = document.createElement('span'); caret.className = 'caret'; caret.textContent = '▍';
    span.appendChild(caret);
    const finish = () => { if (stopped) return; stopped = true; span.textContent = text; bubble.onclick = null; done && done(); };
    const step = () => {
      if (stopped) return;
      if (i >= chars.length) return finish();
      caret.before(chars[i++]);
      typer.t = setTimeout(step, chars[i-1].match(/[.,?!…]/) ? 160 : 26);
    };
    typer = { t: null, stop(){ stopped = true; clearTimeout(this.t); } };
    bubble.onclick = () => { if (typer) clearTimeout(typer.t); finish(); };
    step();
  }
  function hideBubbles(){ kB.classList.remove('show','thought'); cB.classList.remove('show'); choices.classList.remove('show'); }

  function controls({next=false, other=false, restart=false}={}){
    nextBtn.hidden = !next; otherBtn.hidden = !other; restartBtn.hidden = !restart;
  }

  function confetti(){
    const layer = $('confettiLayer'); const colors = ['#990000','#FFCC00','#7ed957','#4fc3f7','#ff7b9c','#fff'];
    for (let n = 0; n < 70; n++){
      const r = document.createElementNS('http://www.w3.org/2000/svg','rect');
      const x = Math.random()*800, w = 6+Math.random()*6;
      r.setAttribute('x', x); r.setAttribute('y', -20 - Math.random()*120);
      r.setAttribute('width', w); r.setAttribute('height', w*0.5);
      r.setAttribute('fill', colors[n % colors.length]);
      r.setAttribute('class','confetti');
      r.style.transformBox = 'fill-box'; r.style.transformOrigin = 'center';
      r.style.animationDuration = (2.2 + Math.random()*1.8) + 's';
      r.style.animationDelay = (Math.random()*0.8) + 's';
      layer.appendChild(r);
    }
    later(() => { layer.innerHTML = ''; }, 5000);
  }

  // ---------- scenes ----------
  function scene1(){
    reset();
    sceneLabel.textContent = 'Scene 1 of 4';
    setFace(kara,'worried');
    later(() => say(kB, T.s1, () => controls({next:true})), 400);
    onNext = scene2;
  }

  function scene2(){
    clearTimers(); hideBubbles(); controls();
    sceneLabel.textContent = 'Scene 2 of 4';
    setPose(kara, []); setFace(kara,'neutral');
    setPose(cat, []); setFace(cat,'normal');
    showCat();
    lastQuestion = scene2Question;
    later(scene2Question, 650);
  }
  function scene2Question(){
    clearTimers(); hideBubbles(); controls();
    sceneLabel.textContent = 'Scene 2 of 4';
    setPose(kara, []); setFace(kara,'neutral');
    setPose(cat, []); setFace(cat,'normal');
    if (!catWrap.classList.contains('in')) showCat();
    say(cB, T.s2q, () => {
      choices.classList.add('show');
      $('yesBtn').onclick = scene2Yes; $('noBtn').onclick = scene2No;
    });
  }
  function scene2Yes(){
    choices.classList.remove('show');
    setPose(cat, ['celebrate']); setFace(cat,'happy');
    setPose(kara, ['cheer']); setFace(kara,'happy');
    confetti();
    say(cB, T.s2y, () => controls({other:true, restart:true}));
    otherBtn.onclick = scene2Question;
  }
  function scene2No(){
    choices.classList.remove('show');
    setPose(cat, ['thinking']); setFace(cat,'think');
    setFace(kara,'neutral');
    cB.querySelector('.txt').textContent = '';
    later(() => {
      setPose(cat, []); setFace(cat,'smile');
      say(cB, T.s2n, () => controls({next:true, other:true}));
    }, 1300);
    otherBtn.onclick = () => { scene2Question(); };
    onNext = scene3;
  }

  function scene3(){
    clearTimers(); hideBubbles(); controls();
    sceneLabel.textContent = 'Scene 3 of 4';
    hideCat();
    setPose(kara, ['thinking']); setFace(kara,'think');
    kB.classList.add('thought');
    later(() => say(kB, T.s3, () => controls({next:true})), 600);
    onNext = scene4;
  }

  function scene4(){
    clearTimers(); hideBubbles(); controls();
    sceneLabel.textContent = 'Scene 4 of 4';
    setPose(kara, []); setFace(kara,'neutral');
    setPose(cat, []); setFace(cat,'normal');
    showCat();
    later(scene4Question, 650);
  }
  function scene4Question(){
    clearTimers(); hideBubbles(); controls();
    sceneLabel.textContent = 'Scene 4 of 4';
    setPose(kara, []); setFace(kara,'neutral');
    setPose(cat, []); setFace(cat,'normal');
    if (!catWrap.classList.contains('in')) showCat();
    say(cB, T.s4q, () => {
      choices.classList.add('show');
      $('yesBtn').onclick = scene4Yes; $('noBtn').onclick = scene4No;
    });
    otherBtn.onclick = scene4Question;
  }
  function scene4Yes(){
    choices.classList.remove('show');
    setPose(cat, []); setFace(cat,'smile');
    setFace(kara,'determined');
    say(cB, T.s4y, () => controls({other:true, restart:true}));
  }
  function scene4No(){
    choices.classList.remove('show');
    setPose(cat, ['frown']); setFace(cat,'frown');
    setFace(kara,'worried');
    say(cB, T.s4n, () => controls({other:true, restart:true}));
  }

  function reset(){
    clearTimers(); hideBubbles(); controls();
    $('confettiLayer').innerHTML = '';
    catWrap.classList.remove('in','out');
    setPose(kara, []); setPose(cat, []);
  }

  nextBtn.onclick = () => onNext && onNext();
  restartBtn.onclick = scene1;
  scene1();
})();
</script>
</body>
</html>
